services:
  db:
    image: mysql:8.0
    container_name: ufape_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: ufape_reserva_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: ufape_backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: ufape_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data: