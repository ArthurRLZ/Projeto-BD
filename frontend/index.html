<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reservas - UFAPE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4 text-success">UFAPE - Histórico de Reservas</h2>
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-success">
                        <tr>
                            <th>Data</th>
                            <th>Solicitante</th>
                            <th>Recurso</th>
                            <th>Finalidade</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-reservas">
                        <!-- O JavaScript vai injetar os dados aqui -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Função para buscar os dados no Backend Python
        async function carregarReservas() {
            try {
                const resposta = await fetch('http://localhost:8000/api/historico-reservas');
                const reservas = await resposta.json();
                
                const tabela = document.getElementById('tabela-reservas');
                tabela.innerHTML = ''; // Limpa a tabela

                reservas.forEach(reserva => {
                    const linha = `
                        <tr>
                            <td>${reserva.data_reserva}</td>
                            <td>${reserva.nome_solicitante}</td>
                            <td>${reserva.nome_recurso}</td>
                            <td>${reserva.finalidade}</td>
                            <td><span class="badge ${reserva.status_aprovacao === 'Aprovada' ? 'bg-success' : reserva.status_aprovacao === 'Rejeitada' ? 'bg-danger' : 'bg-warning'}">${reserva.status_aprovacao}</span></td>
                        </tr>
                    `;
                    tabela.innerHTML += linha;
                });
            } catch (erro) {
                console.error("Erro ao carregar reservas:", erro);
            }
        }

        // Executa a função ao carregar a página
        carregarReservas();
    </script>
</body>
</html>
